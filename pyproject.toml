[project]
name = "sql-learning"
version = "0.1.0"
description = "DuckDB と marimo を使ったローカル SQL 学習環境"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "marimo>=0.9",
    "polars>=1.0",
    "sqlglot>=30.13.0",
]

# [build-system] を書かないことで、uv はこのプロジェクトを
# 「アプリケーション（インストール不要）」として扱い、依存だけを解決します。
